version: "3.8"

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: vtc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vtc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vtc_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtc -d vtc_db"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vtc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ml_service:
    build:
      context: ./ml_service
    container_name: vtc_ml_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vtc}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-vtc_db}
      REDIS_URL: redis://redis:6379/0
      MODEL_PATH: /app/models
    volumes:
      - ./ml_service:/app
      - model_data:/app/models
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  agents:
    build:
      context: ./agents
    container_name: vtc_agents
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vtc}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-vtc_db}
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml_service:8001
      MODEL_PATH: /app/models
    volumes:
      - ./agents:/app
      - ./shared:/app/shared
      - model_data:/app/models
    depends_on:
      db:
        condition: service_healthy
    command: python scheduler.py

  api:
    build:
      context: ./agents
    container_name: vtc_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vtc}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-vtc_db}
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml_service:8001
    volumes:
      - ./agents:/app
      - ./shared:/app/shared
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api_gateway:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pg_data:
  redis_data:
  model_data: